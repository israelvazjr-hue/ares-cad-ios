name: Build ARES CAD iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx cap add ios
      - run: |
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp icon.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath $PWD/build/App.xcarchive archive IPHONEOS_DEPLOYMENT_TARGET=15.0 SWIFT_ENABLE_EXPLICIT_MODULES=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r ARES_CAD.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ARES_CAD-ipa
          path: ARES_CAD.ipa
